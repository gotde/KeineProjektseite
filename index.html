<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Erwischt!</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #111; 
            color: white; 
            margin: 0; 
        }
        h1 { font-size: 3rem; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <h1 id="msg">Ich habe gesagt: NICHT ANKLICKEN! 😜</h1>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('text')) {
            document.getElementById('msg').innerText = params.get('text');
        }
    </script>
</body>
</html>
