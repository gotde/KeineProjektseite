<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Keine Projektseite</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #ffffff; 
            color: Black; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { font-size: 3rem; }
    </style>
</head>
<body>
    <h1 id="hdr">Oooops...</h1>
    <p id="msg"></p>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('text')) {
            document.getElementById('msg').innerText = params.get('text');
        }
    </script>
</body>
</html>
