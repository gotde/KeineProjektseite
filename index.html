<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Keine Projektseite</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex;
            align-items: flex-start;  * 'flex-start' platziert den Inhalt ganz oben */
            min-height: 100vh; 
            background: #ffffff; 
            color: Black; 
            margin: 0; 
        }
        h1 { font-size: 3rem; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <h1 id="hdr">Opps, keine Projektseite/h1>
    <p id="msg"></p>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('text')) {
            document.getElementById('msg').innerText = params.get('text');
        }
    </script>
</body>
</html>
